name: openshift-deploy

on:
  push:
    branches:
      - main
      - release
  # The meshStack GitHub Actions connector dispatches this workflow once a stage is connected.
  workflow_dispatch:

# release deploys to prod, every other branch to dev. The environments and their secrets and
# variables are created by the meshStack GitHub Actions connector, one per stage.
env:
  STAGE: ${{ github.ref == 'refs/heads/release' && 'prod' || 'dev' }}

jobs:
  # The repository is created from this template before its environments exist, so the push of the
  # initial commit finds no credentials. Skip the deployment until the connector has set them up.
  check-environment:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/release' && 'prod' || 'dev' }}
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -n "$KUBECONFIG_CONTENT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No KUBECONFIG secret in environment $STAGE yet, skipping the deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: check-environment
    if: needs.check-environment.outputs.ready == 'true'
    environment: ${{ github.ref == 'refs/heads/release' && 'prod' || 'dev' }}
    env:
      OPENSHIFT_NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}
      OPENSHIFT_REGISTRY: ${{ vars.OPENSHIFT_REGISTRY }}
      APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # podman is preinstalled on the ubuntu runners.
      - name: Build and push image
        env:
          OPENSHIFT_REGISTRY_TOKEN: ${{ secrets.OPENSHIFT_REGISTRY_TOKEN }}
        run: |
          image="$OPENSHIFT_REGISTRY/$OPENSHIFT_NAMESPACE/app:$IMAGE_TAG"
          echo "$OPENSHIFT_REGISTRY_TOKEN" | podman login -u github-actions --password-stdin "$OPENSHIFT_REGISTRY"
          podman build -t "$image" ./app
          podman push "$image"

      - name: Deploy to OpenShift
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          for file in openshift/*.yml; do
            envsubst '$OPENSHIFT_NAMESPACE $APP_HOSTNAME $IMAGE_TAG' < "$file" | kubectl -n "$OPENSHIFT_NAMESPACE" apply -f -
          done
          kubectl -n "$OPENSHIFT_NAMESPACE" rollout status deployment/app --timeout=180s

      - name: Summary
        run: |
          echo "Deployed to $STAGE: https://$APP_HOSTNAME" >> "$GITHUB_STEP_SUMMARY"
